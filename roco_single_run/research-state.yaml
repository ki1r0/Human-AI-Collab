project:
  title: "Faithful RoCo 2026 single-rollout reproduction"
  question: "Can the public RoCo gearbox environment and ACT execution path complete one genuine learned closed-loop Task 1 rollout on this machine?"
  status: active
  started: "2026-08-20"
  domain: "robot learning, bimanual manipulation, Isaac Lab reproducibility"

literature:
  key_papers:
    - id: roco2026
      title: "RoCo Challenge at AAAI 2026: Benchmarking Robotic Collaborative Manipulation for Assembly Towards Industrial Automation"
      url: "https://arxiv.org/abs/2603.15469"
      relevance: "Primary benchmark/task definition and baseline provenance."
  open_problems:
    - "The official public repository does not publish an ACT checkpoint or matching dataset_stats.pkl."
    - "The canonical VLA runner disagrees with the ACT training loader about RGB and qpos normalization."
    - "The current repository defaults to R1 Lite although its README describes R1 as the default and the public simulation demonstrations/checkpoint candidate use R1."
  evidence_gaps:
    - "Empirical task success of the available third-party RoCo-trained ACT checkpoint."
    - "A demonstration episode small enough to use for the replay diagnostic without downloading the 2.32 TB release."
    - "Official rule-policy score with the smallest PhysX-legal collision compatibility margins."

hypotheses:
  - id: H1
    statement: "The local nvcr.io/nvidia/isaac-lab:2.3.0 image can launch the pinned RoCo R1 Task 1 environment with all assets resolved."
    status: supported_with_compatibility_patch
    motivation: "The image matches the official Isaac Lab 2.3.0 / Isaac Sim 5.1.0 contract and isolates the contaminated host Conda setup."
    parent: null
    priority: high
  - id: H2
    statement: "Training-faithful ACT inference requires RGB division by 255 and qpos standardization using the checkpoint's dataset_stats.pkl."
    status: active
    motivation: "The ACT dataset loader and upstream ACT eval path apply both transformations, while scripts/VLA_agent.py omits both."
    parent: null
    priority: high
  - id: H3
    statement: "yjsm1203/roco_model_act_2 is architecture- and embodiment-compatible with the official R1 Task 1 ACT path."
    status: pending
    motivation: "It is a public RoCo-trained ACT checkpoint with matching stats, but it is not organizer-published and includes additional data."
    parent: null
    priority: high
  - id: H4
    statement: "The exact policy-to-environment mapping is [L0..L5,Lgrip,R0..R5,Rgrip] -> [L0..L5,R0..R5,Lgrip,Rgrip]."
    status: supported
    motivation: "The official runner commit 0b8ad47 added this mapping to match the environment joint index construction."
    parent: null
    priority: high
  - id: H5
    statement: "The official Galaxea R1 rule policy reaches the intended Task 1 score of 6 after the Stage A compatibility preparation."
    status: refuted_at_0.15m_offset
    motivation: "This separates environment/controller/physics viability from learned-policy quality before checkpoint rollout."
    parent: H1
    priority: high
  - id: H6
    statement: "Restoring the R1/checkpoint-era 0.20 m table and external-environment workspace offset increases the official rule-oracle score above 3."
    status: supported
    motivation: "The 0.15 m offset was introduced after R1 Lite became default, while the learned-agent cfg and December 2025 R1 source remain at 0.20 m."
    parent: H5
    priority: high
  - id: H7
    statement: "At least one of seeds 17, 23, and 42 improves the corrected-workspace rule oracle above score 4 because ring pick success is randomized-start sensitive."
    status: refuted
    motivation: "Seed 2026 mounted all three pin gears but lost the left-arm ring grasp from a positive-Y initial placement."
    parent: H6
    priority: high
  - id: H8
    statement: "Reducing the compatibility-only contact-offset inflation to a 1 micrometre legal epsilon lets the ring seat without destroying the three carrier-pin placements."
    status: refuted
    motivation: "The source deliberately uses zero contact offset for tight insertion, while the first compatibility patch added up to 0.5 mm of extra carrier contact envelope beyond the minimum PhysX 5.1 constraint."
    parent: H6
    priority: high
  - id: H9
    statement: "Holding the ring wrist orientation fixed after descent preserves the scored pin placements and lets the remaining official phases reach score 6."
    status: supported_but_insufficient
    motivation: "Both contact-offset regimes gain a ring-related point at descent and lose pin relations only during the subsequent 30-degree wrist rotation."
    parent: H8
    priority: high
  - id: H10
    statement: "Raising the reducer mount endpoint by 5 mm avoids destructive contact while allowing the reducer to settle onto the middle gear."
    status: supported_but_insufficient
    motivation: "Zero ring rotation preserves four physical relationships; score reaches 5 during reducer alignment but collapses during its final 25 mm descent/release."
    parent: H9
    priority: high
  - id: H11
    statement: "Extending reducer release from 0.5 s to 1.5 s lets the right gripper clear the part before retreat and preserves the assembled stack."
    status: refuted
    motivation: "At the 0.5 s release boundary the right gripper has moved only from 6.84 mm to 7.17 mm toward a 40 mm command, so the retreat drags the still-grasped reducer and assembly."
    parent: H10
    priority: high
  - id: H12
    statement: "Raising the reducer endpoint to 40 mm prevents ring compression, unjams the gripper, and preserves the stack through release."
    status: active
    motivation: "At the 30 mm endpoint the reducer pushes the ring down by about 10.3 mm before release and the gripper closes slightly despite a 40 mm open command."
    parent: H11
    priority: high

experiments:
  proxy_metric: "Highest official environment assembly score in a live learned-policy rollout; target score >= 6 with fresh observations at every step."
  baseline_value: null
  best_value: null
  total_runs: 0
  diagnostic_runs: 12
  trajectory: []

outer_loop:
  cycle: 8
  last_direction: "reducer contact clearance"
  last_reflection: "A clean 1.5 s release run leaves the gripper closed and still collapses at step 3270. The reducer has already driven the ring down 10.3 mm at release start, so add 10 mm endpoint clearance while retaining the extended observation window."

workspace:
  findings: "findings.md"
  log: "research-log.md"
  literature_dir: "literature/"
  experiments_dir: "experiments/"
  to_human_dir: "to_human/"
  paper_dir: "paper/"
