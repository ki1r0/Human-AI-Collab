# Scatter Layout — initial part placement spec for tools/scatter_parts.py
#
# Separated from the scatter script so positions/surfaces can be edited as data.
# tools/scatter_parts.py reads this file and writes the transforms into
# assets/simple_room_scene.usd (see docs/object_placement.md, docs/scene_authoring.md).
#
# Per-part entry forms (under `parts:`):
#   bbox-contact (preferred):
#     <Part>: {xy: [x, y], surface: table|floor, rot: [rx, ry, rz], z: <override>}
#       - xy       required; world X/Y translate
#       - surface  required for Z; bbox bottom rests at <surface>_surface_z + spawn_margin
#       - rot      optional Euler XYZ degrees (xformOp:rotateXYZ), applied before Z
#       - z        optional explicit Z override (skips bbox contact)
#   legacy absolute:
#     <Part>: {pos: [x, y, z]}        # translate set directly; rotation preserved

meta:
  scene: assets/simple_room_scene.usd
  description: Initial scatter poses and surface constants for scatter_parts.py

# ---------------------------------------------------------------------------
# Surface constants (Z-up, world metres)
# ---------------------------------------------------------------------------
surfaces:
  table_surface_z: -0.1     # bbox-contact target for surface: table
  floor_surface_z: 0.0      # bbox-contact target for surface: floor
  spawn_margin: 0.005       # clearance above the surface (bbox bottom = surface + margin)
  table_z: 0.022            # legacy absolute-translate Z (only for pos-form entries)
  floor_z: 0.02             # legacy absolute-translate Z (only for pos-form entries)

# ---------------------------------------------------------------------------
# Part initial poses
# ---------------------------------------------------------------------------
