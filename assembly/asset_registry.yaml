# Asset Registry — I2R Gearbox Assembly
# Single source of truth for part names, prim paths, initial poses,
# plug/socket topology, and grasp metadata.
#
# Conventions:
#   prim_path    : USD path when the part is unassembled (root of /World).
#                  After assembly the part is reparented; use _find_prim_path()
#                  by name rather than hard-coding the assembled path.
#   category     : floor  = large part placed near floor (z ≈ 0.02 m world)
#                  table  = small part placed on workbench (tabletop z ≈ -0.1 m world)
#                  assembled = starts pre-assembled; no standalone scatter pose
#   plugs        : Xform children on this part used when it attaches AS A CHILD
#   sockets      : Xform children on this part where other parts attach TO IT
#   parent_connection : canonical parent in the assembly sequence (null = root)
#   grasp_hints  : authored grasp frames (to be populated in Phase 1E);
#                  empty list = auto-generate from geometry_hint at runtime
#   placement    : tools/scatter_parts.py is authoritative for actual spawn pose;
#                  initial_pose/category below are documentation only and may lag it.

meta:
  version: "1.0"
  date: "2026-04-17"
  scene: assets/simple_room_scene.usd
  world_root: /Root   # scene default prim (was /World — incorrect)
  table_z: -0.1     # workbench tabletop surface Z (world metres); mesh top ≈ -0.091
  floor_z: 0.02     # floor-level scatter Z
  spawn_margin: 0.005  # clearance above surface when fixing hover bug

# ---------------------------------------------------------------------------
# STRUCTURAL CASINGS
# ---------------------------------------------------------------------------

parts:

  - name: Casing_Base
    prim_path: /World/Casing_Base
    manipulable: true          # too large/heavy for single-arm grasp; fixture
    role: structure
    geometry_hint: box
    initial_pose:
      position: [-1.80, 1.50, 0.02]
      rotation_euler: [0, 0, 0]
      category: floor
    plugs: []                   # root part; never attaches as a child
    sockets:
      - socket_gear_input       # receives Input_Shaft
      - socket_gear_transfer    # receives Transfer_Shaft
      - socket_gear_output      # receives Output_Shaft
      - socket_hub_output       # receives Hub_Cover_Output_Base
      - socket_hub_small_1      # receives Hub_Cover_Small_Base_01
      - socket_hub_small_2      # receives Hub_Cover_Small_Base_02
      - socket_casing_mate      # receives Casing_Top (plug_casing_mate)
      # - socket_bolt_casing_1
      # - socket_bolt_casing_2
      # - socket_bolt_casing_3
      # - socket_bolt_casing_4
      # - socket_bolt_casing_5
      # - socket_bolt_casing_6
      - socket_bolt_hub_1
      - socket_bolt_hub_2
      - socket_bolt_hub_3
      - socket_bolt_hub_4
      - socket_bolt_hub_5
      - socket_bolt_hub_6
      - socket_bolt_hub_7
      - socket_bolt_hub_8
      - socket_bolt_hub_9
      - socket_bolt_hub_10
      - socket_bolt_hub_11
      - socket_bolt_hub_12
      - socket_oil_1
      - socket_oil_2
      - socket_breather
    parent_connection: null
    grasp_hints: []
    notes: "Assembly root. Fixed on workbench; not robot-manipulated."

  - name: Casing_Top
    prim_path: /World/Casing_Top
    manipulable: true
    role: structure
    geometry_hint: box
    initial_pose:
      position: [1.80, 1.50, 0.02]
      rotation_euler: [0, 0, 0]
      category: floor
    plugs:
      - plug_casing_mate        # mates into Casing_Base/socket_casing_mate
    sockets:
      - socket_hub_output       # receives Hub_Cover_Output_Top
      - socket_hub_input        # receives Hub_Cover_Input_Top
      - socket_hub_small        # receives Hub_Cover_Small_Top
      - socket_bolt_casing_1
      - socket_bolt_casing_2
      - socket_bolt_casing_3
      - socket_bolt_casing_4
      - socket_bolt_casing_5
      - socket_bolt_casing_6
      - socket_bolt_hub_1
      - socket_bolt_hub_2
      - socket_bolt_hub_3
      - socket_bolt_hub_4
      - socket_bolt_hub_5
      - socket_bolt_hub_6
      - socket_bolt_hub_7
      - socket_bolt_hub_8
      - socket_bolt_hub_9
      - socket_bolt_hub_10
      - socket_bolt_hub_11
      - socket_bolt_hub_12
    parent_connection:
      parent: Casing_Base
      plug: plug_casing_mate
      socket: socket_casing_mate
    grasp_hints: []
    notes: "Mated onto Casing_Base after all base-side parts are installed. Needs flip (180 deg Z) before mating — see /flip_casing_base command."

# ---------------------------------------------------------------------------
# SHAFTS  (first physical robot target: Input_Shaft)
# ---------------------------------------------------------------------------

  - name: Input_Shaft
    prim_path: /World/Input_Shaft
    manipulable: true
    role: shaft
    geometry_hint: cylinder
    initial_pose:
      position: [-1.80, 0.00, 0.02]
      rotation_euler: [90, 0, 0]
      category: floor
    plugs:
      - plug_main
    sockets:
      - socket_gear             # receives bearings and/or gear
    parent_connection:
      parent: Casing_Base
      plug: plug_main
      socket: socket_gear_input
    kinematic_offset:           # Z offset applied during combine (from magic_assembly)
      z: -74.9                  # local units; see MagicAssemblyManager._Z_OVERRIDE
    grasp_hints: []
    notes: >
      FIRST ROBOT TARGET (Phase 1D). Cylindrical geometry, clear vertical
      grasp axis. Top grasp above centroid is the primary candidate.
      Insertion axis aligns with socket_gear_input on Casing_Base.

  - name: Transfer_Shaft
    prim_path: /World/Transfer_Shaft
    manipulable: true
    role: shaft
    geometry_hint: cylinder
    initial_pose:
      position: [0.00, 1.80, 0.02]
      rotation_euler: [0, 90, 0]
      category: floor
    plugs:
      - plug_main
    sockets:
      - socket_gear
    parent_connection:
      parent: Casing_Base
      plug: plug_main
      socket: socket_gear_transfer
    kinematic_offset:
      z: -27.0
    grasp_hints: []

  - name: Output_Shaft
    prim_path: /World/Output_Shaft
    manipulable: true
