# ---------------------------------------------------------------------------
# M6 HUB BOLTS  (12 bolts at socket indices 1-12)
# ---------------------------------------------------------------------------
# Scene prim names use `_base` (01..12) and `_top` (01..12) suffixes — these
# are declared as `alternate_names` so the runtime's registry-aware
# _find_prim_path fallback resolves canonical name → scene prim.

  - name: M6_Hub_Bolt_01_base
    prim_path: /World/M6_Hub_Bolt_01_base
    alternate_names: [M6_Hub_Bolt_01_Base]
    manipulable: true
    role: fastener
    geometry_hint: cylinder
    initial_pose:
      position: [-1.00, 0.80, 0.02]      # all M6 bolts share this scatter position (stacked)
      rotation_euler: [0, 0, 0]
      category: floor
    plugs: [plug_main]
    sockets: []
    parent_connection:
      parent: Casing_Base
      plug: plug_main
      socket: socket_bolt_hub_1
    kinematic_offset:
      z: 29.2
    grasp_hints: []
    notes: >
      Hub bolt for socket_bolt_hub_1. 12 managed bolts per half (M6_Hub_Bolt_01..12):
      _base -> Casing_Base, _top -> Casing_Top; 24 total, all identical/interchangeable.
      Convention: 4 bolts per hub cover x 3 covers = 12 per half (the bolt->cover
      grouping is procedural knowledge, defined in the assembly DAG, not here).
